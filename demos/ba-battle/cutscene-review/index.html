const descriptions=[
 'The thrower waits beside the Mercat Cross, above the crowd in Broad Street.',
 'The thrower releases the Ba’ across the kerb toward the road.',
 'Hands reach for the Ba’ over the road.',
 'From above, the scrum closes on Broad Street.',
 'The scrum presses toward the goal wall at Mackinson’s Corner.',
 'Inside the scrum, a hand presses the Ba’ against the wall.',
 'The Ba’ drops toward the water between players in Kirkwall Harbour.',
 'The Ba’ breaks the surface between the players.',
 'The Uppies lift their winner with the Ba’ held overhead.',
 'The Doonies lift their winner above the harbour water.'
];
const scenes={
 throw:{place:'Mercat Cross',finish:'The scrum closes',frames:[[0,730,72,52],[1,730,57,47],[2,650,48,43],[3,1040,52,58]]},
 wall:{place:'Mackinson’s Corner',finish:'Uppies Ba’ !!',frames:[[4,910,67,52],[5,1100,76,45],[8,1450,51,49]]},
 water:{place:'Kirkwall Harbour',finish:'Doonies Ba’ !!',frames:[[6,960,53,57],[7,850,53,70],[9,1450,53,49]]}
};
const shot=document.querySelector('#shot'),button=document.querySelector('#play'),progress=document.querySelector('#progress');
const place=document.querySelector('#location'),beat=document.querySelector('#beat');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const decoded=images.map(src=>{const img=new Image();img.src=src;return img.decode().catch(()=>{});});
let selected='throw',generation=0,frame=0;
function show([idx,duration,x,y],moving){
 shot.src=images[idx];
 shot.alt=descriptions[idx];
 shot.style.setProperty('--x',x+'%');shot.style.setProperty('--y',y+'%');
 for(const animation of shot.getAnimations())animation.cancel();
 if(moving&&!reducedMotion.matches){
  const impact=idx===5||idx===7;
  const lift=idx>=8;
  shot.animate(lift?[
   {transform:'scale(1.04) translateY(8px)'},
   {transform:'scale(1.085) translateY(0)'}
  ]:impact?[
   {transform:'scale(1.10) translateX(-2px)'},
   {transform:'scale(1.045) translateX(2px)',offset:.16},
   {transform:'scale(1.08)'}
  ]:[{transform:'scale(1)'},{transform:'scale(1.105)'}],{duration,easing:'ease-out',fill:'forwards'});
 }
}
async function play(){
 const token=++generation,scene=scenes[selected];
 cancelAnimationFrame(frame);button.textContent='Replay';
 place.textContent=scene.place;beat.textContent='';progress.value=0;
 await Promise.all(scene.frames.map(([idx])=>decoded[idx]));
 if(token!==generation)return;
 const length=scene.frames.reduce((sum,[,duration])=>sum+duration,0);
 let previous=-1;
 const start=performance.now();
 function tick(now){
  if(token!==generation)return;
  const elapsed=Math.max(0,now-start);
  let index=0,until=scene.frames[0][1];
  while(elapsed>=until&&index<scene.frames.length-1)until+=scene.frames[++index][1];
  if(index!==previous){show(scene.frames[index],true);previous=index;}
  if(elapsed>=length-(selected==='throw'?310:980))beat.textContent=scene.finish;
  progress.value=Math.min(1,elapsed/length);
  if(elapsed<length)frame=requestAnimationFrame(tick);
 }
 frame=requestAnimationFrame(tick);
}
for(const control of document.querySelectorAll('nav button'))control.onclick=()=>{
 selected=control.dataset.scene;
 for(const item of document.querySelectorAll('nav button'))item.setAttribute('aria-pressed',String(item===control));
 play();
};
button.onclick=play;
place.textContent=scenes.throw.place;show(scenes.throw.frames[0],false);
</script>
